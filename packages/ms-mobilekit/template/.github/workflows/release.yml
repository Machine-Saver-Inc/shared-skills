name: release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { shell: bash } }
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Stamp version from tag
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed -i "s/VERSION = '.*'/VERSION = '$V'/" www/js/version.js
          npm version "$V" --no-git-tag-version
      - run: npm ci && npm run version:check
      - name: Android project
        run: |
          [ -d android ] || npx cap add android
          node node_modules/ms-mobilekit/tools/apply_native.mjs
          npx cap sync android
      - name: Build (unsigned; Play App Signing signs on upload)
        run: cd android && ./gradlew bundleRelease assembleRelease --no-daemon
      - name: Collect
        run: |
          mkdir -p dist && cp android/app/build/outputs/bundle/release/app-release.aab dist/
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/ || true
          cd dist && sha256sum * > SHA256SUMS
      - run: npm run release-notes > dist/BODY.md
      - uses: softprops/action-gh-release@v2
        with: { body_path: dist/BODY.md, files: "dist/*" }
      - name: Verify the published assets download anonymously
        run: sleep 10 && curl -fsSL -o /tmp/a.aab "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/app-release.aab" && sha256sum /tmp/a.aab
  # iOS: archives need macOS + signing secrets (APPLE_CERT_P12, APPLE_CERT_PASSWORD, APPLE_PROVISION, ASC_API_KEY).
  # Until they exist, build locally: npx cap open ios → Product → Archive → TestFlight. See SKILL §6.
