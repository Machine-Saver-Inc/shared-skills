[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-appkit"
version = "1.1.0"
description = "The shared shell every Machine Saver desktop application is built on."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Machine Saver Inc" }]
dependencies = [
    "PySide6-Essentials>=6.6",
    "certifi>=2024.2.2",
]

[project.urls]
Homepage = "https://github.com/Machine-Saver-Inc/shared-skills"
Source = "https://github.com/Machine-Saver-Inc/shared-skills/tree/main/packages/ms-appkit"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ms_appkit = ["resources/*.png", "resources/icons/*.svg", "resources/icons/*"]

# Stated, not inherited. With no [tool.ruff] section ruff falls back to its own
# defaults, and those differ between versions -- a local run found nothing while
# the build found twenty-one. A lint whose rule set is implicit is not a lint;
# it is two different lints that happen to share a name.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
