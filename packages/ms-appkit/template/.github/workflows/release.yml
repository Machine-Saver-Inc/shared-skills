name: Release

# A PUBLIC program's releases go to GitHub Releases. A private program uses
# release-private.yml (Machine Saver's release store) instead: keep one of the
# two files and delete the other (skill section 1a).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

env:
  SLUG: example-tool

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A push that times out can leave the tag pointing at a commit that is
      # on no branch, and the release then ships code nobody can find.
      - name: The tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main. Push main, wait for CI, then tag."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # One source of truth: a build can never disagree with its tag.
      - name: Stamp the version
        run: printf '__version__ = "%s"\n' "$VERSION" > example_app/_version.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/example_app.spec

      # Inno Setup is NOT preinstalled on the GitHub Windows runners.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $out = Join-Path $PWD 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          & $iscc "/DAppVersion=$env:VERSION" "/O$out" 'packaging\windows\example_app.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }

      - name: Checksum and release notes
        run: |
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          python tools/release_notes.py "$VERSION" > release-body.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: release-body.md
          files: out/*

      # Uploading is not the same as being downloadable.
      - name: The published files match SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir check && cd check
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY"
          sha256sum -c SHA256SUMS
          echo "every published file matches its checksum."
