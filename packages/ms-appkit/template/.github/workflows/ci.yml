# ms-appkit template v2
name: CI

# The family's CI lives once, in shared-skills, and is called here at a kit
# tag; the family sweep moves the tag. A monthly run finds a program nobody
# has touched broken by a kit, Python or runner change before its next release.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

jobs:
  ci:
    uses: Machine-Saver-Inc/shared-skills/.github/workflows/desktop-ci.yml@ms-appkit/v1.5.1
    with:
      package: example_app
