name: Release

# A private program's releases go to Machine Saver's release store, not to
# GitHub Releases (skill section 1a): the people who run it have a
# machinesaver.net account and usually no GitHub account.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: read
  id-token: write        # lets the job prove to Google and Azure which repository it is

env:
  BUCKET: machinesaver-desktop-releases
  SLUG: example-tool

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    # Azure trusts this repository's "release" environment to sign (the
    # federated credential names it); a tag name changes, the environment does not.
    environment: release
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A push that times out can leave the tag pointing at a commit that is
      # on no branch, and the release then ships code nobody can find.
      - name: The tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main. Push main, wait for CI, then tag."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # Every Windows build is signed as Machine Saver Inc with Azure Artifact
      # Signing (skill section 6). Five repository variables, none secret:
      # Azure trusts GitHub's word for which repository this is.
      - name: Signing is configured
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID SIGNING_ENDPOINT SIGNING_ACCOUNT SIGNING_PROFILE; do
            [ -n "${!name}" ] || { echo "::error::repository variable $name is not set; an unsigned release is not shipped (skill section 6)"; exit 1; }
          done

      # One source of truth: a build can never disagree with its tag.
      - name: Stamp the version
        run: |
          printf '__version__ = "%s"\n' "$VERSION" > example_app/_version.py
          cat example_app/_version.py

      - name: Stamp the sign-in key (never committed)
        env:
          SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          [ -n "$SECRET" ] || { echo "::error::GOOGLE_CLIENT_SECRET is not set"; exit 1; }
          printf 'CLIENT_SECRET = "%s"\n' "$SECRET" > example_app/_client_secret.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/example_app.spec

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The program itself, before Inno Setup packs it: an installed copy and
      # every update the program fetches carry the signature too.
      - name: Sign the program
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\ExampleTool\ExampleTool.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      # The key is loaded by name, so only the archive itself can say it is there.
      # Read after signing: the signed program is the one that ships.
      - name: The frozen build carries its sign-in key
        run: python -m ms_appkit.frozen_check dist/ExampleTool/ExampleTool.exe example_app._client_secret

      # Inno Setup is NOT preinstalled on the GitHub Windows runners.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Inno Setup calls sign.ps1 for the setup program and for the uninstaller
      # it writes inside it, with the module the signing step above installed.
      - name: Build the Windows installer, signed with its uninstaller
        shell: pwsh
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          $sign = Join-Path $env:RUNNER_TEMP 'sign.ps1'
          @'
          param([string]$File)
          $ErrorActionPreference = 'Stop'
          Import-Module ArtifactSigning
          $params = @{
            Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT
            CertificateProfileName = $env:SIGNING_PROFILE; Files = $File; FileDigest = 'SHA256'
            TimestampRfc3161 = 'http://timestamp.acs.microsoft.com'; TimestampDigest = 'SHA256'
            ExcludeEnvironmentCredential = $true; ExcludeWorkloadIdentityCredential = $true
            ExcludeManagedIdentityCredential = $true; ExcludeSharedTokenCacheCredential = $true
            ExcludeVisualStudioCredential = $true; ExcludeVisualStudioCodeCredential = $true
            ExcludeAzurePowerShellCredential = $true; ExcludeAzureDeveloperCliCredential = $true
            ExcludeInteractiveBrowserCredential = $true
          }
          Invoke-ArtifactSigning @params
          '@ | Set-Content -Encoding utf8 $sign
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $out = Join-Path $PWD 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          & $iscc "/DAppVersion=$env:VERSION" "/DSign" "/Sartifactsigning=pwsh -NoProfile -ExecutionPolicy Bypass -File $sign `$f" "/O$out" 'packaging\windows\example_app.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem $out -Filter *.exe | ForEach-Object { Write-Host $_.Name }

      # Windows' own check, on what ships, before anything is checksummed.
      - name: Windows says every program is signed by Machine Saver
        shell: pwsh
        run: |
          $files = @(Get-Item 'dist\ExampleTool\ExampleTool.exe') + @(Get-ChildItem out -Filter *.exe)
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "$($file.Name): $($sig.Status) by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($file.Name) is not validly signed: $($sig.StatusMessage)" }
            if ($sig.SignerCertificate.Subject -notmatch 'CN="?Machine Saver') { throw "$($file.Name) is signed by someone else" }
          }

      - name: Checksum and release notes
        run: |
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS && cd ..
          python tools/release_notes.py "$VERSION" > release-body.md
          head -20 release-body.md

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_RELEASE_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      # The feed is written last, so no program is ever offered a version
      # whose files are not there yet.
      - name: Publish, feed last
        run: |
          gcloud storage cp out/* "gs://$BUCKET/$SLUG/v$VERSION/"
          python -c "import os, pathlib; from ms_appkit.update.channel import feed; \
            print(feed(os.environ['VERSION'], pathlib.Path('release-body.md').read_text(encoding='utf-8'), \
                       sorted(os.listdir('out'))))" > latest.json
          cat latest.json
          gcloud storage cp latest.json "gs://$BUCKET/$SLUG/latest.json"

      # A private release that anyone can fetch is a failed release.
      - name: An anonymous download must be refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://storage.googleapis.com/storage/v1/b/$BUCKET/o/$SLUG%2Flatest.json?alt=media")
          [ "$code" = 401 ] || [ "$code" = 403 ] || { echo "::error::anonymous got $code"; exit 1; }
          echo "anonymous was refused ($code)."

      # Uploading is not the same as being downloadable.
      - name: The published files match SHA256SUMS
        run: |
          mkdir check && gcloud storage cp "gs://$BUCKET/$SLUG/v$VERSION/*" check/
          cd check && sha256sum -c SHA256SUMS
          echo "every published file matches its checksum."
