# Python lint for a Machine Saver repository. Ratcheted through
# scripts/ci/ratchet.py, so switching it on never blocks existing code.
#
# The rule sets are chosen for what agents get wrong, not for style:
#   F      unused imports/variables, undefined names (dead code)
#   E9     syntax errors and I/O errors
#   B      bugbear: mutable defaults, unused loop vars, bare except
#   SIM    simplify: code that says in six lines what one would
#   C901   cyclomatic complexity ceiling
#   ERA    commented-out code. Comments say why; they never hold code.
#   PLR09  too many arguments / branches / statements
# Style is left to `ruff format`. There is no comment-density rule, on
# purpose: a quota in either direction produces slop.

line-length = 100
target-version = "py310"

[lint]
select = ["F", "E9", "B", "SIM", "C901", "ERA", "PLR09"]
ignore = ["B008"]

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-args = 6
max-branches = 12
max-statements = 50
