# Every issue and PR lands on the organisation Project board the moment it
# opens, so nobody maintains a list by hand and nothing is tracked twice.
#
# Needs two repository settings, both one-time:
#   vars.PROJECT_NUMBER   the board's number in its URL
#   secrets.PROJECT_TOKEN a fine-grained token with organisation Projects
#                         read/write; GITHUB_TOKEN cannot touch org boards.
# Until both are set the job says so and passes, so a missing setting is
# visible in the log without turning the PR red.

name: project-sync

on:
  issues:
    types: [opened, reopened, transferred]
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Settings present
        id: settings
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
        run: |
          if [ -z "$PROJECT_TOKEN" ] || [ -z "$PROJECT_NUMBER" ]; then
            echo "::warning::project-sync: set secrets.PROJECT_TOKEN and vars.PROJECT_NUMBER to put this item on the board"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/add-to-project@v2.0.0
        if: steps.settings.outputs.ok == 'true'
        with:
          project-url: https://github.com/orgs/${{ github.repository_owner }}/projects/${{ vars.PROJECT_NUMBER }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
