# Maintainability — main tier (skill §4 step 3; the repo's records ADR and
# its generated-files ADR).
# After every merge to main: regenerate the agent context map and the board
# view, lower every ratchet baseline to what is left, and commit the result as
# the repo's Maintainability Bot App through GitHub's API. That commit is
# signed by GitHub and lands on main because that App, and only that App, is a
# ruleset bypass actor (the generated-files ADR); nothing here is ever written by a person or
# by an agent PR.
#
# Trust boundary: the jobs that run third-party tools never see the App's
# token. They hand their output over as artifacts; a last job with a fresh
# checkout and no installs mints the token and commits only the allow-listed
# paths, with the copy of commit_via_api.py from the trusted commit.
#
# No pipefail: the finding tools exit non-zero when they find anything, and
# the ratchet after the pipe is the verdict. That is why no job sets
# `shell: bash` explicitly: an explicit bash shell runs with `-o pipefail`.

name: maintainability-main

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"     # weekly, so a quiet week still refreshes
  workflow_dispatch:

permissions: {}

concurrency:
  group: maintainability-main
  cancel-in-progress: false

jobs:
  # PowerShell has to run on a Windows runner; it lowers its own baseline.
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lower the PSScriptAnalyzer baseline
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error |
            ForEach-Object { "$([System.IO.Path]::GetRelativePath((Get-Location).Path, $_.ScriptPath)):$($_.Line): $($_.RuleName) $($_.Message)" } |
            python scripts/ci/ratchet.py update --baseline .maintainability/pssa.baseline
      - uses: actions/upload-artifact@v7
        with:
          name: generated-windows
          path: .maintainability/pssa.baseline
          include-hidden-files: true

  # Generates everything, holds no token.
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tools
        run: |
          pip install --quiet ruff==0.17.3 vulture==2.14 ctxmap==0.1.0
          sudo apt-get install -y -qq shellcheck >/dev/null
          npm install --global --silent jscpd@4.0.5

      # Session-start map for agents. Structural only (no LLM); the timestamp
      # line goes, since the commit is the timestamp and a changing line would
      # make every run a change.
      - name: Context map
        env:
          PYTHONUTF8: "1"
        run: |
          ctxmap build --root .
          ctxmap context --root . --force
          sed -i '/^\*Generated by ctxmap\. Last updated:/c\*Generated by ctxmap on every merge to main; the commit is the timestamp. Do not edit managed sections.*' CONTEXT.md

      # The architecture rule applies to every generated file: no IPs, endpoints
# or key material.
      - name: Context map holds no secrets or endpoints
        run: |
          ! grep -Eq '([0-9]{1,3}\.){3}[0-9]{1,3}|https?://|-----BEGIN' CONTEXT.md

      # The only status file in the repo, rendered from the org board (rule R4).
      - name: Status page from the project board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          gh project item-list "${{ vars.PROJECT_NUMBER }}" --owner "$GITHUB_REPOSITORY_OWNER" \
              --format json --limit 500 \
            | python3 scripts/ci/render_status.py > STATUS.md

      # Ratchet every baseline DOWN to what remains; `update` refuses growth,
      # so a bypass merge that added findings fails here, loudly.
      - name: Lower baselines
        run: |
          ruff check --config .maintainability/ruff.toml --output-format concise . 2>/dev/null \
            | grep -E '^[^ ]+:[0-9]+:[0-9]+: ' \
            | python3 scripts/ci/ratchet.py update --baseline .maintainability/ruff.baseline
          vulture --min-confidence 80 scripts cloud mcp eval 2>/dev/null \
            | python3 scripts/ci/ratchet.py update --baseline .maintainability/vulture.baseline
          git ls-files '*.sh' | xargs shellcheck -f gcc -S warning 2>/dev/null \
            | python3 scripts/ci/ratchet.py update --baseline .maintainability/shellcheck.baseline
          jscpd --silent --reporters json --output "$RUNNER_TEMP/jscpd" \
                --format python,bash,powershell,yaml --min-lines 12 --min-tokens 70 \
                scripts cloud edge >/dev/null 2>&1 || true
          python3 scripts/ci/jscpd_findings.py "$RUNNER_TEMP/jscpd/jscpd-report.json" \
            | python3 scripts/ci/ratchet.py update --baseline .maintainability/jscpd.baseline
          python3 scripts/ci/check_layout.py --baseline

      - uses: actions/upload-artifact@v7
        with:
          name: generated-linux
          path: |
            CONTEXT.md
            STATUS.md
            .maintainability/ruff.baseline
            .maintainability/vulture.baseline
            .maintainability/shellcheck.baseline
            .maintainability/jscpd.baseline
            .maintainability/layout-tolerated.txt
          include-hidden-files: true

  # Fresh checkout of the trusted commit, nothing installed, token minted here
  # and nowhere else, and only the allow-listed paths can reach the commit.
  commit:
    needs: [refresh, powershell]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: generated-linux
          path: .

      - uses: actions/download-artifact@v7
        with:
          name: generated-windows
          path: .maintainability

      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.MAINT_APP_ID }}
          private-key: ${{ secrets.MAINT_APP_PRIVATE_KEY }}
          permission-contents: write

      # One API commit, signed by GitHub, only when something changed (the generated-files ADR).
      - name: Commit as the App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          python3 scripts/ci/commit_via_api.py --repo "$GITHUB_REPOSITORY" --branch main \
            --message "chore(maintainability): refresh context, status and baselines [skip ci]" \
            --allow CONTEXT.md --allow STATUS.md --allow .maintainability/ \
            CONTEXT.md STATUS.md \
            .maintainability/ruff.baseline .maintainability/vulture.baseline \
            .maintainability/shellcheck.baseline .maintainability/jscpd.baseline \
            .maintainability/pssa.baseline .maintainability/layout-tolerated.txt
