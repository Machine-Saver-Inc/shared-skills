name: Desktop CI (reusable)

# The family's CI for a Machine Saver desktop program, called from the
# program's own ci.yml at a kit tag:
#
#   jobs:
#     ci:
#       uses: Machine-Saver-Inc/shared-skills/.github/workflows/desktop-ci.yml@ms-appkit/v1.5.0
#       with:
#         package: example_app
#
# Every lesson section 6 of the skill was written from lives here once, and
# the family sweep moves the @tag, so a program that nobody has touched still
# runs this year's checks. (housekeeping.ci_workflow_faults accepts a ci.yml
# that calls this at a tag.)

on:
  workflow_call:
    inputs:
      package:
        description: "The program's Python package, e.g. example_app"
        required: true
        type: string
      tracked:
        description: "Space-separated packaging inputs that must be tracked by git, beyond the defaults"
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Windows runners default to PowerShell; every step below is bash.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxkbcommon0

      - name: Install
        run: pip install -e ".[dev]"

      - name: Packaging inputs are tracked by git
        env:
          PACKAGE: ${{ inputs.package }}
          EXTRA: ${{ inputs.tracked }}
        run: |
          for f in pyproject.toml ms-app.json "$PACKAGE/resources/icon.png" \
                   packaging/windows/icon.ico tools/release_notes.py $EXTRA \
                   $(ls packaging/*.spec packaging/windows/*.iss 2>/dev/null); do
            git ls-files --error-unmatch "$f" > /dev/null
          done

      - name: Lint
        run: ruff check .

      - name: House rules and tests
        env:
          QT_QPA_PLATFORM: offscreen
          # Only the build knows whether the repository is private (skill 1a).
          MS_REPO_PRIVATE: ${{ github.event.repository.private }}
          PYTHONFAULTHANDLER: "1"
        run: |
          set +e
          python -m pytest -q -rs
          code=$?
          echo "pytest exited with $code"
          exit $code

      - name: The interface tests actually ran
        env:
          QT_QPA_PLATFORM: offscreen
          MS_REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python -m pytest -q -rs > result.txt 2>&1 || true
          cat result.txt
          if grep -qE "SKIPPED .*(PySide6|Qt)" result.txt; then
            echo "interface tests skipped; Qt is missing on this runner"; exit 1
          fi
          grep -qE "[0-9]+ passed" result.txt
